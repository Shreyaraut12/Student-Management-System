<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Update Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

    body{
        background-color:#f4f6f9;
        font-family:Arial, sans-serif;
    }

    .card{
        border:none;
        border-radius:15px;
    }

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/students}">

            Student Management System

        </a>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/students}">

                        Students

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/students/new}">

                        Add Student

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Form Section -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg p-4">

                <h2 class="text-center mb-4">
                    Update Student
                </h2>

                <p class="text-center text-muted">
                    Modify student details below
                </p>

                <form th:action="@{/students/{id}(id=${student.id})}"
                      th:object="${student}"
                      method="post">

                    <!-- Hidden ID -->

                    <input type="hidden"
                           th:field="*{id}">

                    <!-- First Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Student First Name
                        </label>

                        <input type="text"
                               th:field="*{firstName}"
                               class="form-control">

                    </div>

                    <!-- Last Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Student Last Name
                        </label>

                        <input type="text"
                               th:field="*{lastName}"
                               class="form-control">

                    </div>

                    <!-- Email -->

                    <div class="mb-4">

                        <label class="form-label">
                            Student Email
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control">

                    </div>

                    <!-- Buttons -->

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/students}"
                           class="btn btn-secondary">

                            Back

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Update Student

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
